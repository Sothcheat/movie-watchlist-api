services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    ports:
      # Host port 5433 avoids clashing with other Postgres containers on 5432. Bound to
      # loopback so the database isn't reachable from the network.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ keeps data in a version subdirectory, so mount the parent path.
      - pgdata:/var/lib/postgresql
      # Runs once, when the volume is first created: creates the test database.
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose up -d postgres` starts only the database (for `pnpm start:dev` on the host).
  # `docker compose up --build` also builds and runs the API in a container.
  api:
    build: .
    image: movie-watchlist-api:local
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Same settings as `pnpm start:dev`; the variables below replace the ones that differ in Docker.
    env_file: .env
    environment:
      # Inside the compose network the database is "postgres" on its own port, not localhost:5433.
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
